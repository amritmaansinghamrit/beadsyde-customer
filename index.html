<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beadsyde - Order Your Infinity Essentials</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Daydream&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/customer.css">
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container">
            <div class="logo-section">
                <div class="logo">
                    <img src="assets/images/beadsyde logo.jpg" alt="Beadsyde Logo">
                </div>
                <div class="brand-info">
                    <h1 class="brand-name">Beadsyde</h1>
                </div>
            </div>
            <nav class="main-nav">
                <div class="cart-icon" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2 class="hero-title"><strong>Choose Your <span class="infinity-text">Infinity</span></strong></h2>
            <p class="hero-subtitle">Premium Anti-Tarnish Stainless Steel • Waterproof with Love and Care</p>
        </div>
    </section>

    <!-- Simple Category Tabs -->
    <section class="products-section">
        <div class="container">
            <div class="category-tabs">
                <button class="tab-button active" data-category="all">All Items</button>
                <button class="tab-button" data-category="necklaces">∞ Infinity Necklace</button>
                <button class="tab-button" data-category="bracelets">∞ Infinity Bracelet</button>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="footer-content">
            <p><i class="fab fa-instagram"></i> Follow us: <a href="https://www.instagram.com/beadsyde/" target="_blank" class="footer-link">@beadsyde</a> | <i class="fab fa-whatsapp"></i> Join our <a href="https://chat.whatsapp.com/BTUOnwDzoLgBfCnrjNcL6j" target="_blank" class="footer-link">WhatsApp Community</a></p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        console.log('🚀 Starting Beadsyde Customer Site...');

        // Add error handling
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('JavaScript Error:', {
                message: msg,
                source: url,
                line: lineNo,
                column: columnNo,
                error: error
            });
            return false;
        };
    </script>
    <script src="assets/js/customer.js"></script>
    <script>
        // Emergency fallback - manually add products if main script fails
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🔍 DOM Content Loaded - checking elements...');

            const productsGrid = document.getElementById('productsGrid');
            const cartIcon = document.getElementById('cartIcon');

            console.log('Products Grid:', productsGrid);
            console.log('Cart Icon:', cartIcon);
            console.log('Beadsyde Customer:', window.beadsydeCustomer);

            // If the main script didn't work, add products manually
            setTimeout(() => {
                if (productsGrid && productsGrid.innerHTML.trim() === '') {
                    console.log('🔧 Main script failed, adding products manually...');

                    const products = [
                        { id: 1, name: 'Silver Infinity Necklace', price: 499, image: 'assets/images/silver necklace.png', description: 'Premium Anti-Tarnish Stainless Steel • Waterproof' },
                        { id: 2, name: 'Golden Infinity Necklace', price: 499, image: 'assets/images/infinity necklace gold.jpg', description: 'Premium Anti-Tarnish Stainless Steel • Waterproof' },
                        { id: 3, name: 'Silver Infinity Bracelet', price: 349, image: 'assets/images/infinity bracelet silver.jpg', description: 'Premium Anti-Tarnish Stainless Steel • Waterproof' },
                        { id: 4, name: 'Golden Infinity Bracelet', price: 349, image: 'assets/images/infinity bracelet gold.jpg', description: 'Premium Anti-Tarnish Stainless Steel • Waterproof' }
                    ];

                    const html = products.map(product => `
                        <div class="product-card" style="background: white; border: 1px solid #e1e1e1; border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                            <div class="product-image" style="width: 100%; height: 200px; background: #F5F1E8; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                                <img src="${product.image}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'; this.parentNode.innerHTML='📿'">
                            </div>
                            <div class="product-info" style="padding: 15px;">
                                <h3 style="font-size: 1.2em; margin-bottom: 8px; color: #1a1a1a; font-weight: 600;">${product.name}</h3>
                                <div style="font-size: 1.6em; color: #2E5BBA; font-weight: 700; margin-bottom: 12px;">₹${product.price}</div>
                                <p style="color: #4a4a4a; margin-bottom: 15px; font-size: 0.9em;">${product.description}</p>
                                <button onclick="alert('Add to cart functionality - please refresh page!')" style="background: #2E5BBA; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%;">
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    `).join('');

                    productsGrid.innerHTML = html;
                    console.log('✅ Products added manually');
                }
            }, 2000);
        });
    </script>
</body>
</html>
