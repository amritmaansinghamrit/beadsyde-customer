<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Beadsyde</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/customer.css">
    <style>
        .cart-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .cart-title {
            font-size: 2.5em;
            color: var(--primary-blue);
            margin-bottom: 10px;
        }

        .cart-subtitle {
            color: var(--text-medium);
            font-size: 1.1em;
        }

        .cart-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .item-description {
            color: var(--text-medium);
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .item-price {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--primary-blue);
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .qty-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .qty-btn:hover {
            background: #1e4a9f;
        }

        .qty-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .qty-display {
            background: var(--neutral-beige);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            min-width: 40px;
            text-align: center;
        }

        .remove-item {
            background: var(--error-red);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .remove-item:hover {
            background: #dc2626;
        }

        .cart-summary {
            margin-top: 30px;
            padding: 20px;
            background: var(--neutral-beige);
            border-radius: 10px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .summary-total {
            font-weight: 700;
            font-size: 1.3em;
            color: var(--primary-blue);
            border-top: 1px solid var(--border-light);
            padding-top: 15px;
            margin-top: 15px;
        }

        .cart-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary {
            background: white;
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
        }

        .btn-secondary:hover {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #1e4a9f;
            transform: translateY(-2px);
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-cart i {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-cart h3 {
            margin-bottom: 15px;
            color: var(--text-medium);
        }

        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .item-details {
                text-align: center;
            }

            .cart-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container">
            <div class="logo-section">
                <div class="logo">
                    <img src="../assets/images/beadsyde logo.jpg" alt="Beadsyde Logo">
                </div>
                <div class="brand-info">
                    <h1 class="brand-name">Beadsyde</h1>
                    <p class="tagline">Shopping Cart</p>
                </div>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">← Continue Shopping</a>
            </nav>
        </div>
    </header>

    <div class="cart-container">
        <div class="cart-header">
            <h1 class="cart-title">🛒 Your Cart</h1>
            <p class="cart-subtitle">Review your items before checkout</p>
        </div>

        <div class="cart-content">
            <div id="cartItems">
                <!-- Cart items will be loaded here -->
            </div>

            <div id="cartSummary" style="display: none;">
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal (<span id="itemCount">0</span> items):</span>
                        <span id="subtotal">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping:</span>
                        <span id="shipping">₹100</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Total:</span>
                        <span id="total">₹0</span>
                    </div>
                </div>

                <div class="cart-actions">
                    <button class="btn btn-secondary" onclick="continueShopping()">
                        <i class="fas fa-arrow-left"></i>
                        Continue Shopping
                    </button>
                    <button class="btn btn-primary" onclick="proceedToCheckout()">
                        <i class="fas fa-credit-card"></i>
                        Proceed to Checkout
                    </button>
                </div>
            </div>

            <div id="emptyCart" class="empty-cart" style="display: none;">
                <i class="fas fa-shopping-cart"></i>
                <h3>Your cart is empty</h3>
                <p>Add some beautiful jewelry to get started!</p>
                <button class="btn btn-primary" onclick="continueShopping()" style="margin-top: 20px; max-width: 200px;">
                    <i class="fas fa-shopping-bag"></i>
                    Start Shopping
                </button>
            </div>
        </div>
    </div>

    <script>
        class CartManager {
            constructor() {
                this.cart = [];
                this.init();
            }

            init() {
                this.loadCart();
                this.displayCart();
            }

            loadCart() {
                const savedCart = localStorage.getItem('beadsyde_cart');
                if (savedCart) {
                    this.cart = JSON.parse(savedCart);
                }
            }

            saveCart() {
                localStorage.setItem('beadsyde_cart', JSON.stringify(this.cart));
                this.updateCartCount();
            }

            updateCartCount() {
                // Update header cart count if present
                const cartCount = document.querySelector('#cartCount');
                if (cartCount) {
                    const totalItems = this.cart.reduce((sum, item) => sum + item.quantity, 0);
                    cartCount.textContent = totalItems;
                }
            }

            displayCart() {
                const cartItems = document.getElementById('cartItems');
                const cartSummary = document.getElementById('cartSummary');
                const emptyCart = document.getElementById('emptyCart');

                if (this.cart.length === 0) {
                    cartItems.innerHTML = '';
                    cartSummary.style.display = 'none';
                    emptyCart.style.display = 'block';
                    return;
                }

                emptyCart.style.display = 'none';
                cartSummary.style.display = 'block';

                const html = this.cart.map((item, index) => `
                    <div class="cart-item">
                        <div class="item-image">
                            <img src="${item.image}" alt="${item.name}" onerror="this.style.display='none'">
                        </div>
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-description">${item.description}</div>
                            <div class="item-price">₹${item.price} each</div>
                            <div class="quantity-controls">
                                <button class="qty-btn" onclick="cartManager.updateQuantity(${index}, -1)" ${item.quantity <= 1 ? 'disabled' : ''}>-</button>
                                <span class="qty-display">${item.quantity}</span>
                                <button class="qty-btn" onclick="cartManager.updateQuantity(${index}, 1)">+</button>
                                <button class="remove-item" onclick="cartManager.removeItem(${index})">
                                    <i class="fas fa-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 1.3em; font-weight: 700; color: var(--primary-blue);">
                                ₹${item.price * item.quantity}
                            </div>
                        </div>
                    </div>
                `).join('');

                cartItems.innerHTML = html;
                this.updateSummary();
            }

            updateQuantity(index, change) {
                if (index >= 0 && index < this.cart.length) {
                    this.cart[index].quantity += change;

                    if (this.cart[index].quantity <= 0) {
                        this.cart.splice(index, 1);
                    }

                    this.saveCart();
                    this.displayCart();
                }
            }

            removeItem(index) {
                if (confirm('Remove this item from your cart?')) {
                    this.cart.splice(index, 1);
                    this.saveCart();
                    this.displayCart();
                }
            }

            updateSummary() {
                const totalItems = this.cart.reduce((sum, item) => sum + item.quantity, 0);
                const subtotal = this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const shipping = subtotal >= 999 ? 0 : 100;
                const total = subtotal + shipping;

                document.getElementById('itemCount').textContent = totalItems;
                document.getElementById('subtotal').textContent = `₹${subtotal}`;
                document.getElementById('shipping').textContent = shipping === 0 ? 'FREE' : `₹${shipping}`;
                document.getElementById('total').textContent = `₹${total}`;
            }
        }

        function continueShopping() {
            window.location.href = 'index.html';
        }

        function proceedToCheckout() {
            if (cartManager.cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            window.location.href = 'checkout.html';
        }

        // Initialize cart manager
        let cartManager;
        document.addEventListener('DOMContentLoaded', () => {
            cartManager = new CartManager();
        });
    </script>
</body>
</html>
